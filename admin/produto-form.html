<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUG Moda — Admin · Produto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/admin.css" />
</head>
<body class="admin">
  <header class="admin-header">
    <a href="dashboard.html" class="logo">AUG <span>MODA</span></a>
    <nav>
      <a href="dashboard.html">← Produtos</a>
      <button type="button" id="logout-btn">Sair</button>
    </nav>
  </header>

  <main class="admin-main">
    <div class="admin-toolbar">
      <h1 id="form-title">Novo produto</h1>
    </div>

    <form id="product-form">
      <div class="field">
        <label>Fotos do produto</label>
        <div id="photo-gallery" class="photo-gallery"></div>
        <input type="file" id="image-file" accept="image/*" multiple />
        <p class="helper-text" id="upload-status">A primeira foto da lista vira a capa no catálogo. Pode enviar mais de uma de uma vez.</p>
      </div>

      <div class="field">
        <label for="name">Nome</label>
        <input type="text" id="name" required placeholder="Ex: Camisa Social Slim" />
      </div>

      <div class="field">
        <label for="category">Categoria</label>
        <input type="text" id="category" required placeholder="Ex: Camisas" />
      </div>

      <div class="field">
        <label for="description">Descrição</label>
        <textarea id="description" placeholder="Detalhes da peça, tecido, corte..."></textarea>
      </div>

      <div class="field">
        <label for="price">Preço (R$)</label>
        <input type="number" id="price" step="0.01" min="0" required placeholder="129.90" />
      </div>

      <div class="field">
        <label for="promo_price">Preço promocional (R$) — opcional</label>
        <input type="number" id="promo_price" step="0.01" min="0" placeholder="99.90" />
      </div>

      <div class="field">
        <label>
          <input type="checkbox" id="active" checked style="width:auto;display:inline-block;margin-right:8px" />
          Visível no site
        </label>
      </div>

      <hr style="border:none;border-top:1px dashed var(--line);margin:24px 0" />

      <div class="field">
        <label>Tamanhos, cores e estoque</label>
        <div id="variants-container"></div>
        <button type="button" class="btn-outline-add" id="add-variant-btn">+ Adicionar variação</button>
      </div>

      <p class="form-error" id="form-error"></p>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="submit-btn">Salvar produto</button>
        <a href="dashboard.html" class="btn btn-ghost" style="text-align:center">Cancelar</a>
      </div>
    </form>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/pages/produto-form.js"></script>
</body>
</html>
